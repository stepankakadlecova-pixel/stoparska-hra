<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopařská mise</title>

  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Patrick Hand', cursive;
      text-align: center;
      color: #234028;
      background:
        linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.65)),
        url("images/les.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: min(1250px, 94%);
      margin: 0 auto;
      padding: 10px 0 35px;
    }

    h1 {
      font-family: 'Amatic SC', cursive;
      font-size: clamp(52px, 9vw, 90px);
      margin: 5px 0 10px;
      letter-spacing: 2px;
      color: #1f3d26;
      text-shadow: 0 4px 12px rgba(255,255,255,0.8);
    }

    .intro {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(4px);
      border-radius: 26px;
      padding: 16px 22px;
      margin: 0 auto 32px;
      max-width: 800px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.16);
    }

    .intro p,
    .score {
      font-size: clamp(23px, 4vw, 32px);
      font-weight: bold;
      margin: 6px 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 28px 22px;
      margin: 22px auto 35px;
      align-items: center;
    }

    .card {
      min-height: 185px;
      background: rgba(255,255,255,0.92);
      border: 5px solid #6ea04f;
      border-radius: 24px;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 14px 24px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3.4s ease-in-out infinite;
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
    }

    .card:nth-child(1)  { transform: rotate(-4deg) translateY(10px); }
    .card:nth-child(2)  { transform: rotate(3deg) translateY(-12px); animation-duration: 3.9s; }
    .card:nth-child(3)  { transform: rotate(-2deg) translateY(18px); animation-duration: 4.4s; }
    .card:nth-child(4)  { transform: rotate(5deg) translateY(-6px); }
    .card:nth-child(5)  { transform: rotate(-5deg) translateY(14px); animation-duration: 4.9s; }
    .card:nth-child(6)  { transform: rotate(2deg) translateY(-18px); }
    .card:nth-child(7)  { transform: rotate(-3deg) translateY(4px); animation-duration: 4.2s; }
    .card:nth-child(8)  { transform: rotate(4deg) translateY(16px); }
    .card:nth-child(9)  { transform: rotate(-6deg) translateY(-10px); animation-duration: 4.6s; }
    .card:nth-child(10) { transform: rotate(3deg) translateY(12px); }
    .card:nth-child(11) { transform: rotate(-2deg) translateY(-14px); animation-duration: 3.8s; }
    .card:nth-child(12) { transform: rotate(5deg) translateY(8px); }
    .card:nth-child(13) { transform: rotate(-4deg) translateY(20px); animation-duration: 4.7s; }
    .card:nth-child(14) { transform: rotate(2deg) translateY(-8px); }
    .card:nth-child(15) { transform: rotate(-3deg) translateY(6px); animation-duration: 4.1s; }

    .card img {
      max-width: 100%;
      height: 135px;
      object-fit: contain;
      pointer-events: none;
    }

    .card:hover {
      box-shadow: 0 20px 36px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.98);
      z-index: 5;
    }

    .selected {
      background: #fff3a3;
      border-color: #e0aa00;
      box-shadow: 0 0 0 6px rgba(224,170,0,0.22), 0 16px 28px rgba(0,0,0,0.22);
    }

    .matched {
      background: #c5f2bd;
      border-color: #38963b;
      pointer-events: none;
      opacity: 0.82;
    }

    .wrong {
      background: #ffb7b7;
      border-color: #cc3333;
    }

    button {
      font-family: 'Patrick Hand', cursive;
      background: #4f8f3a;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 14px 30px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
    }

    button:hover {
      background: #3d732d;
    }

    @keyframes float {
      0%   { translate: 0 0; }
      50%  { translate: 0 -8px; }
      100% { translate: 0 0; }
    }

    @media (max-width: 700px) {
      .board {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px 10px;
      }

      .card {
        min-height: 130px;
        border-width: 4px;
        border-radius: 18px;
        padding: 8px;
      }

      .card img {
        height: 95px;
      }

      .intro {
        margin-bottom: 18px;
      }
    }

    @media (max-width: 430px) {
      .board {
        grid-template-columns: repeat(2, 1fr);
      }

      .card {
        min-height: 135px;
      }

      .card img {
        height: 100px;
      }

      h1 {
        font-size: 58px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌲 Stopařská mise 🐾</h1>

    <div class="intro">
      <div class="score">
        Nalezené trojice: <span id="score">0</span>
      </div>
      <p>Klikni na zvíře, jeho stopu a jeho trus.</p>
    </div>

    <div class="board" id="board"></div>

    <button onclick="restartGame()">Hrát znovu</button>
  </div>

  <script>
    const groups = [
      {
        id: 1,
        cards: [
          { image: "images/jezevec.png", label: "Jezevec" },
          { image: "images/stopa-jezevec.png", label: "Stopa jezevce" },
          { image: "images/trus-jezevec.png", label: "Trus jezevce" }
        ]
      },
      {
        id: 2,
        cards: [
          { image: "images/rys.png", label: "Rys" },
          { image: "images/stopa-rys.png", label: "Stopa rysa" },
          { image: "images/trus-rys.png", label: "Trus rysa" }
        ]
      },
      {
        id: 3,
        cards: [
          { image: "images/srnka.png", label: "Srnka" },
          { image: "images/stopa-srnka.png", label: "Stopa srnky" },
          { image: "images/trus-srnka.png", label: "Trus srnky" }
        ]
      },
      {
        id: 4,
        cards: [
          { image: "images/veverka.png", label: "Veverka" },
          { image: "images/stopa-veverka.png", label: "Stopa veverky" },
          { image: "images/trus-veverka.png", label: "Trus veverky" }
        ]
      },
      {
        id: 5,
        cards: [
          { image: "images/zajic.png", label: "Zajíc" },
          { image: "images/stopa-zajic.png", label: "Stopa zajíce" },
          { image: "images/trus-zajic.png", label: "Trus zajíce" }
        ]
      }
    ];

    let cards = [];
    let selectedCards = [];
    let score = 0;

    const board = document.getElementById("board");
    const scoreElement = document.getElementById("score");

    function createCards() {
      cards = [];
      groups.forEach(group => {
        group.cards.forEach(card => {
          cards.push({
            id: group.id,
            image: card.image,
            label: card.label
          });
        });
      });
      cards.sort(() => Math.random() - 0.5);
    }

    function renderBoard() {
      board.innerHTML = "";

      cards.forEach(card => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<img src="${card.image}" alt="${card.label}">`;
        div.addEventListener("click", () => selectCard(div, card));
        board.appendChild(div);
      });
    }

    function selectCard(element, card) {
      if (
        selectedCards.length >= 3 ||
        element.classList.contains("selected") ||
        element.classList.contains("matched")
      ) return;

      element.classList.add("selected");
      selectedCards.push({ element, card });

      if (selectedCards.length === 3) checkMatch();
    }

    function checkMatch() {
      const allSameGroup = selectedCards.every(
        item => item.card.id === selectedCards[0].card.id
      );

      if (allSameGroup) {
        selectedCards.forEach(item => {
          item.element.classList.remove("selected");
          item.element.classList.add("matched");
        });

        score++;
        scoreElement.textContent = score;
        selectedCards = [];

        if (score === groups.length) {
          setTimeout(() => {
            alert("Výborně! Našel/našla jsi všechny zvířecí trojice! 🌲🐾");
          }, 300);
        }
      } else {
        selectedCards.forEach(item => item.element.classList.add("wrong"));

        setTimeout(() => {
          selectedCards.forEach(item => {
            item.element.classList.remove("selected", "wrong");
          });
          selectedCards = [];
        }, 900);
      }
    }

    function restartGame() {
      score = 0;
      selectedCards = [];
      scoreElement.textContent = score;
      createCards();
      renderBoard();
    }

    restartGame();
  </script>
</body>
</html>
